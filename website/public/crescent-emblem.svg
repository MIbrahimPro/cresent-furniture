<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="t d">
  <title id="t">Crescent maker's seal</title>
  <desc id="d">Cream crescent beneath a terracotta sweep, ringed by a dashed brass circle — the workshop's maker's seal.</desc>
  <!-- outer craft rings -->
  <circle cx="240" cy="240" r="222" fill="none" stroke="#F3ECE2" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="240" cy="240" r="202" fill="none" stroke="#C9A36A" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 11"/>
  <!-- sweep -->
  <path d="M150 208 Q240 96 330 208" fill="none" stroke="#E07856" stroke-width="11" stroke-linecap="round"/>
  <!-- crescent -->
  <path d="M240 135 A115 115 0 1 0 240 365 A95 95 0 1 1 240 135 Z" fill="#F3ECE2"/>
  <!-- three brass dots -->
  <circle cx="196" cy="398" r="5" fill="#C9A36A"/>
  <circle cx="240" cy="406" r="5" fill="#C9A36A"/>
  <circle cx="284" cy="398" r="5" fill="#C9A36A"/>
</svg>
